name: Generate Lockfile

# Manual, on-demand workflow (no automatic trigger) that generates package-lock.json and
# opens a PR with it. Run this once from the Actions tab ("Run workflow") whenever the
# lock file is missing or badly out of date — most importantly the first time, since
# `npm ci` in ci.yml/release.yml fails outright without one ("Dependencies lock file is
# not found... Supported file patterns: package-lock.json,npm-shrinkwrap.json,yarn.lock").
#
# Deliberately a separate manual workflow rather than folding lockfile generation into
# ci.yml itself: CI should stay read-only/fast and never push commits on your behalf as a
# side effect of a normal push or PR run. This one only runs when you explicitly ask for
# it, and only ever proposes its result as a PR for you to review and merge — it never
# pushes straight to main.

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # No `cache: npm` here — actions/setup-node's npm cache mode itself requires a
          # lock file to key the cache on, which is exactly what doesn't exist yet.

      # Root package.json declares backend/frontend as npm workspaces, so a single
      # `npm install` at the repo root resolves and writes one package-lock.json
      # covering both, same as `npm ci` in ci.yml/release.yml expects to consume.
      - name: Generate package-lock.json
        run: npm install

      - name: Open PR with the generated lock file
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore: add package-lock.json'
          branch: chore/generate-lockfile
          delete-branch: true
          title: 'chore: add package-lock.json'
          add-paths: package-lock.json
          body: |
            Auto-generated by the manually-triggered **Generate Lockfile** workflow
            (`.github/workflows/generate-lockfile.yml`).

            `npm ci` in `ci.yml`/`release.yml` needs a lock file to install from and none
            existed in the repo. This PR adds the `package-lock.json` generated by
            `npm install` at the repo root, which covers both the `backend` and
            `frontend` npm workspaces declared in the root `package.json`.

            Merge this to unblock CI. If any other open branches/PRs were failing CI for
            the same "Dependencies lock file is not found" reason, merge `main` into them
            afterward (or rebase) so they pick up this file too.
