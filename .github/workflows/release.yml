name: Release

# See ARCHITECTURE.md -> Testing & CI/CD -> "CD (packaging, not deployment)" and ->
# Suggested build order, step 6 ("Electron packaging (Windows exe)") / its "Electron
# packaging -- build sequence" subsection for full status and rationale.
#
# Electron packaging sub-steps 1-4 (main process skeleton, packaged-mode frontend/data
# paths, electron-builder config, better-sqlite3 Electron-ABI rebuild) are done -- see
# electron/main.js and the root package.json `build` config. This workflow adds
# sub-step 5: an actual `electron-builder` packaging job producing a Windows
# installer/exe, alongside (not replacing) the existing local-bundle tarball job below,
# which stays useful for anyone who'd rather run the app locally via `npm ci && npm
# start` without installing anything.
#
# IMPORTANT: This workflow builds a Windows installer but does NOT end-to-end test it.
# Manual verification on first release to new OS/architecture is recommended. The
# sanity-check step below verifies that frontend/dist, backend, and native modules are
# present in the packaged asar, but does not actually run the installed app. See
# ARCHITECTURE.md's "Electron packaging -- build sequence" for the full debugging trail.

on:
  push:
    tags: ['v*.*.*']
  # Manual trigger for sanity-checking package-electron-win in isolation (e.g. the
  # ARCHITECTURE.md "Sanity-check finding" re: hoisted node_modules / root package.json
  # having no `dependencies` field) without cutting a real tagged release. The
  # release-publish steps below are gated to `refs/tags/*` so a workflow_dispatch run
  # builds and inspects the installer but never publishes it.
  workflow_dispatch: {}

env:
  NODE_VERSION: '24'

jobs:
  # Same gate as CI — a release should never ship on top of a red build. This job is
  # intentionally duplicated (not `needs: ci`) since the CI workflow only triggers on
  # push/pull_request, not on tag pushes.
  #
  # Shares the same node_modules-cache pattern as ci.yml (see that file's header comment
  # for the full rationale): this job populates the cache on a miss, and
  # package-local-bundle below restores the same key instead of running `npm ci` a
  # second time for what's otherwise identical dependencies within one workflow run.
  verify:
    runs-on: ubuntu-latest
    outputs:
      node-modules-key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - id: key
        run: echo "key=node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - name: Restore node_modules cache
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
          key: ${{ steps.key.outputs.key }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run lint
      - run: npm run test -w backend
      - run: npm run test:electron
      - run: npm run test -w frontend
      - run: npm run build -w frontend

  package-local-bundle:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore node_modules cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
          key: ${{ needs.verify.outputs.node-modules-key }}
      - run: npm run build -w frontend

      - name: Assemble local-bundle archive
        run: |
          set -euo pipefail
          BUNDLE_DIR="proetsy-${{ github.ref_name }}"
          mkdir -p "$BUNDLE_DIR"
          cp -r backend "$BUNDLE_DIR/backend"
          rm -rf "$BUNDLE_DIR/backend/node_modules" "$BUNDLE_DIR/backend/data"
          mkdir -p "$BUNDLE_DIR/frontend"
          cp -r frontend/dist "$BUNDLE_DIR/frontend/dist"
          cp package.json package-lock.json README.md ARCHITECTURE.md "$BUNDLE_DIR/"
          tar -czf "$BUNDLE_DIR.tar.gz" "$BUNDLE_DIR"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: proetsy-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
          body: |
            Local-bundle release for ${{ github.ref_name }}. Extract, then from the
            extracted folder: `npm ci --workspace backend`, copy `backend/.env.example`
            to `backend/.env` and fill in a Gemini key, then `npm start -w backend`.
            The built frontend (`frontend/dist`) is included but not yet served by the
            backend directly.

  # Electron packaging build-sequence sub-step 5. Runs on windows-latest rather than
  # cross-compiling the NSIS target from Linux via Wine, since a native module
  # (better-sqlite3) is involved and native-rebuild tooling is most reliable running on
  # its actual target OS rather than under emulation. A separate, full `npm ci` runs here
  # (rather than restoring `verify`'s Ubuntu node_modules cache) since native deps built
  # on Ubuntu aren't usable on Windows regardless of caching -- npmRebuild (see root
  # package.json's `build` config) then rebuilds better-sqlite3 specifically against
  # Electron's own Node ABI, on top of whatever `npm ci` just installed.
  package-electron-win:
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Deliberately NOT env.NODE_VERSION (24) for this job -- see ARCHITECTURE.md
      # "Electron packaging -- build sequence" for the finding: better-sqlite3 has no
      # prebuilt binary for Node 24 on win32-x64 yet, so `npm ci` fell back to a
      # from-source node-gyp compile, which then failed on windows-latest with
      # "Could not find any Visual Studio installation to use". Pinning this job to a
      # well-established LTS avoids the compile-from-source path entirely rather than
      # fighting node-gyp's VS detection. Every other job keeps using env.NODE_VERSION.
      ELECTRON_JOB_NODE_VERSION: '22'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.ELECTRON_JOB_NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Verify electron:build script includes frontend build
        shell: bash
        run: |
          if grep -q '"electron:build".*build.*frontend' package.json; then
            echo "✓ electron:build script includes 'build -w frontend'"
          else
            echo "ERROR: electron:build script does not include frontend build"
            echo "This is likely a regression. package.json should have:"
            echo '  "electron:build": "npm run build -w frontend && electron-builder --win --publish=never"'
            exit 1
          fi
      - run: npm run build -w frontend

      # Debug aid: confirms the build outputs actually exist on disk right before
      # electron-builder runs, so a failure can be split into "build didn't produce
      # these files" vs "electron-builder ignored files that were there" without
      # needing to download the packaged artifact.
      - name: List build outputs before packaging
        shell: bash
        run: |
          echo "=== frontend/dist (pre-packaging) ==="
          find frontend/dist -type f 2>/dev/null | head -50 || echo "frontend/dist NOT FOUND"
          echo ""
          echo "=== backend (pre-packaging, top-level) ==="
          find backend -maxdepth 1 2>/dev/null || echo "backend NOT FOUND"

      - name: Build Windows installer
        env:
          # electron-builder logs every files-glob include/exclude decision at this
          # level -- this is the direct way to see why a configured `files` pattern
          # (e.g. frontend/dist/**/*, backend/**/*) isn't matching anything, without
          # downloading the packaged output to inspect it by hand.
          DEBUG: electron-builder
        run: npm run electron:build

      # Sanity-check step: verifies that critical app components (frontend, backend,
      # native modules) were actually packaged into the asar. Runs regardless of build
      # success/failure so partial builds are visible for debugging. This catches
      # regressions like missing frontend/dist builds, incomplete backend copies, or
      # failed native module rebuilds.
      - name: Verify asar contents
        if: always()
        shell: bash
        run: |
          set -x
          find release-builds -maxdepth 2 -type d || echo "no release-builds dir"
          ASAR=$(find release-builds -name app.asar | head -n1 || true)
          if [ -z "$ASAR" ]; then
            echo "ERROR: NO app.asar FOUND -- build did not produce packaged output"
            exit 1
          fi
          
          echo "Verifying required app components in asar..."
          MISSING=0
          
          # Check frontend
          if npx asar list "$ASAR" | grep -q "frontend/dist/index.html"; then
            echo "✓ frontend/dist/index.html found"
          else
            echo "✗ MISSING: frontend/dist/index.html"
            MISSING=1
          fi
          
          # Check backend
          if npx asar list "$ASAR" | grep -q "backend/server.js"; then
            echo "✓ backend/server.js found"
          else
            echo "✗ MISSING: backend/server.js"
            MISSING=1
          fi
          
          # Check native module
          if npx asar list "$ASAR" | grep -q -i "better-sqlite3"; then
            echo "✓ better-sqlite3 found in asar"
          else
            echo "✗ MISSING: better-sqlite3"
            MISSING=1
          fi
          
          # Verify better-sqlite3 native binary was unpacked correctly
          UNPACKED_DIR=$(dirname "$ASAR")/app.asar.unpacked
          if [ -f "$UNPACKED_DIR/node_modules/better-sqlite3/build/Release/better_sqlite3.node" ]; then
            echo "✓ better-sqlite3 native binary unpacked correctly"
          else
            echo "✗ MISSING: better-sqlite3 native binary"
            MISSING=1
          fi
          
          if [ "$MISSING" -eq 1 ]; then
            echo ""
            echo "ERROR: Critical app components missing from packaged asar"
            echo "Full asar contents:"
            npx asar list "$ASAR" | head -50
            exit 1
          fi
          
          echo ""
          echo "✓ All required app components verified in asar"

      - name: Upload packaged app for inspection
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: electron-package-debug
          path: release-builds/
          if-no-files-found: warn
          retention-days: 7

      # electron-builder's own directories.output setting (root package.json's `build`
      # config: "release-builds") controls where this lands; the NSIS installer's exact
      # filename includes the version from package.json, so a glob picks it up without
      # hardcoding a version string here.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          # latest.yml is the update-feed manifest electron-updater's GitHub provider
          # polls to detect new versions -- it must be attached alongside the
          # installer or auto-update silently never finds anything newer. *.blockmap is
          # what lets it attempt a differential (delta) download instead of re-fetching
          # the full ~250MB installer on every update -- electron-builder generates one
          # automatically per NSIS build, it just needs to be published alongside the
          # other two files for electron-updater to find and use it.
          files: |
            release-builds/*.exe
            release-builds/latest.yml
            release-builds/*.blockmap
          generate_release_notes: true
          body: |
            Windows installer for ${{ github.ref_name }}. Run the installer, then launch
            ProEtsy from the Start menu -- no separate Node.js install or manual
            `npm start` needed (unlike the local-bundle tarball release also attached
            here). First run still needs a Gemini API key entered into the app's setup
            screen (ARCHITECTURE.md -> First-Run Setup).

            The installer is unsigned, so Windows SmartScreen will show a "Windows
            protected your PC" warning on first run -- click "More info" -> "Run anyway".
            See ARCHITECTURE.md -> Open Discussions -> "Unsigned Windows exe /
            SmartScreen."
