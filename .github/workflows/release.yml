name: Release

# See ARCHITECTURE.md -> Testing & CI/CD -> "CD (packaging, not deployment)" and ->
# Suggested build order, step 6 ("Electron packaging (Windows exe)") / its "Electron
# packaging -- build sequence" subsection for full status and rationale.
#
# Electron packaging sub-steps 1-4 (main process skeleton, packaged-mode frontend/data
# paths, electron-builder config, better-sqlite3 Electron-ABI rebuild) are done -- see
# electron/main.js and the root package.json `build` config. This workflow adds
# sub-step 5: an actual `electron-builder` packaging job producing a Windows
# installer/exe, alongside (not replacing) the existing local-bundle tarball job below,
# which stays useful for anyone who'd rather run the app locally via `npm ci && npm
# start` without installing anything.
#
# IMPORTANT: three layers of increasingly-real verification run after packaging, added
# incrementally while investigating issue #97 (each layer catches a different class of
# failure the previous one couldn't):
#   1. "Verify asar contents" -- checks frontend/dist, backend/server.js, and the
#      better-sqlite3 native binary are present in the packaged output. File presence
#      only; doesn't catch a present-but-broken file.
#   2. "Verify better-sqlite3 loads under Electron's Node ABI" -- actually require()s the
#      unpacked native module and runs a query, under ELECTRON_RUN_AS_NODE (the same
#      execution mode backendExecutable() uses for the real spawned backend). Catches an
#      ABI mismatch or bad rebuild that step 1 can't see, but only exercises the module
#      in isolation, not the app's real startup sequence.
#   3. "Launch packaged app and verify health check + window" -- runs the actual
#      win-unpacked exe as a normal packaged Electron app (not ELECTRON_RUN_AS_NODE),
#      polls the real /api/health endpoint from outside the app the same way
#      waitForBackend() does from inside it, then checks a window actually appears. This
#      is the first step that exercises the literal failure mode reported in #97
#      ("processes running, no window, Task Manager-visible").
#
# None of this is a substitute for manual verification on a real end-user machine,
# especially on first release to a new OS/architecture: the CI runner is a fresh VM
# without a real GPU (step 3 passes `--disable-gpu` to work around that, which a real
# user's machine doesn't need), and step 3 launches win-unpacked directly rather than
# going through the NSIS installer's actual install path. See ARCHITECTURE.md's
# "Electron packaging -- build sequence" for the full debugging trail.

on:
  push:
    tags: ['v*.*.*']
  # Manual trigger for sanity-checking package-electron-win in isolation (e.g. the
  # ARCHITECTURE.md "Sanity-check finding" re: hoisted node_modules / root package.json
  # having no `dependencies` field) without cutting a real tagged release. The
  # release-publish steps below are gated to `refs/tags/*` so a workflow_dispatch run
  # builds and inspects the installer but never publishes it.
  workflow_dispatch: {}

env:
  # Pinned to a specific patch (not floating '24') -- 24.19.0 has a native-addon
  # cleanup-hook regression that intermittently crashes processes using native
  # modules (e.g. better-sqlite3) during worker/environment teardown. Same fix as
  # ci.yml -- see that file's env block for the full rationale and upstream issue
  # link. Bump deliberately once upstream ships a fix.
  NODE_VERSION: '24.18.0'

jobs:
  # Same gate as CI — a release should never ship on top of a red build. This job is
  # intentionally duplicated (not `needs: ci`) since the CI workflow only triggers on
  # push/pull_request, not on tag pushes.
  #
  # Shares the same node_modules-cache pattern as ci.yml (see that file's header comment
  # for the full rationale): this job populates the cache on a miss, and
  # package-local-bundle below restores the same key instead of running `npm ci` a
  # second time for what's otherwise identical dependencies within one workflow run.
  verify:
    runs-on: ubuntu-latest
    outputs:
      node-modules-key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - id: key
        run: echo "key=node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - name: Restore node_modules cache
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
          key: ${{ steps.key.outputs.key }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run lint
      - run: npm run test -w backend
      - run: npm run test:electron
      - run: npm run test -w frontend
      - run: npm run build -w frontend

  package-local-bundle:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore node_modules cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
          key: ${{ needs.verify.outputs.node-modules-key }}
      - run: npm run build -w frontend

      - name: Assemble local-bundle archive
        run: |
          set -euo pipefail
          BUNDLE_DIR="proetsy-${{ github.ref_name }}"
          mkdir -p "$BUNDLE_DIR"
          cp -r backend "$BUNDLE_DIR/backend"
          rm -rf "$BUNDLE_DIR/backend/node_modules" "$BUNDLE_DIR/backend/data"
          mkdir -p "$BUNDLE_DIR/frontend"
          cp -r frontend/dist "$BUNDLE_DIR/frontend/dist"
          cp package.json package-lock.json README.md ARCHITECTURE.md "$BUNDLE_DIR/"
          tar -czf "$BUNDLE_DIR.tar.gz" "$BUNDLE_DIR"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: proetsy-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
          body: |
            Local-bundle release for ${{ github.ref_name }}. Extract, then from the
            extracted folder: `npm ci --workspace backend`, copy `backend/.env.example`
            to `backend/.env` and fill in a Gemini key, then `npm start -w backend`.
            The built frontend (`frontend/dist`) is included but not yet served by the
            backend directly.

  # Electron packaging build-sequence sub-step 5. Runs on windows-latest rather than
  # cross-compiling the NSIS target from Linux via Wine, since a native module
  # (better-sqlite3) is involved and native-rebuild tooling is most reliable running on
  # its actual target OS rather than under emulation. A separate, full `npm ci` runs here
  # (rather than restoring `verify`'s Ubuntu node_modules cache) since native deps built
  # on Ubuntu aren't usable on Windows regardless of caching -- npmRebuild (see root
  # package.json's `build` config) then rebuilds better-sqlite3 specifically against
  # Electron's own Node ABI, on top of whatever `npm ci` just installed.
  package-electron-win:
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Deliberately NOT env.NODE_VERSION (24) for this job -- see ARCHITECTURE.md
      # "Electron packaging -- build sequence". Every other job keeps using
      # env.NODE_VERSION; this one stays pinned to a well-established LTS.
      ELECTRON_JOB_NODE_VERSION: '22'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.ELECTRON_JOB_NODE_VERSION }}
          cache: npm

      # better-sqlite3 (>=13, N-API) bundles a win32-x64 prebuild and has no
      # install/postinstall script of its own -- but it still ships binding.gyp
      # for platforms without a prebuild, which makes npm implicitly run
      # `node-gyp rebuild` on install regardless. On Windows, node-gyp's
      # `configure` step needs a VS toolchain just to start, before it can even
      # evaluate binding.gyp's own "skip the build, a prebuild exists" logic.
      # This activates the VS toolchain already on the windows-latest image so
      # that configure succeeds; the resulting build is still a no-op and the
      # bundled prebuild is what ships. See #97 for the full investigation.
      - uses: ilammy/msvc-dev-cmd@v1

      # windows-latest now images Visual Studio 2026 (internal major version 18)
      # by default. node-gyp doesn't recognize that version number until
      # v12.1.0 (bundled starting npm@11.6.3) -- older node-gyp reports "unknown
      # version 'undefined'" and rejects the install outright, regardless of
      # whether the VS toolchain itself is correctly detected/activated above.
      # setup-node's Node 22 install bundles an npm below that threshold, so
      # upgrade npm explicitly before npm ci needs its node-gyp to work.
      - run: npm install -g npm@latest

      - run: npm ci
      - name: Verify electron:build script includes frontend build
        shell: bash
        run: |
          if grep -q '"electron:build".*build.*frontend' package.json; then
            echo "✓ electron:build script includes 'build -w frontend'"
          else
            echo "ERROR: electron:build script does not include frontend build"
            echo "This is likely a regression. package.json should have:"
            echo '  "electron:build": "npm run build -w frontend && electron-builder --win --publish=never"'
            exit 1
          fi
      - run: npm run build -w frontend

      # Debug aid: confirms the build outputs actually exist on disk right before
      # electron-builder runs, so a failure can be split into "build didn't produce
      # these files" vs "electron-builder ignored files that were there" without
      # needing to download the packaged artifact.
      - name: List build outputs before packaging
        shell: bash
        run: |
          echo "=== frontend/dist (pre-packaging) ==="
          find frontend/dist -type f 2>/dev/null | head -50 || echo "frontend/dist NOT FOUND"
          echo ""
          echo "=== backend (pre-packaging, top-level) ==="
          find backend -maxdepth 1 2>/dev/null || echo "backend NOT FOUND"

      - name: Build Windows installer
        env:
          # electron-builder logs every files-glob include/exclude decision at this
          # level -- this is the direct way to see why a configured `files` entry
          # isn't matching anything, without downloading the packaged output to
          # inspect it by hand. Note: frontend/dist and backend are packaged via
          # explicit {from,to,filter} object entries in package.json's `build.files`
          # (not plain glob strings) -- see that file for why: electron-builder's
          # matcher special-cases top-level dirs that match an npm `workspaces`
          # entry when given plain string globs, so "frontend/dist/**" style
          # patterns silently match nothing for this repo regardless of glob depth.
          DEBUG: electron-builder
        run: npm run electron:build

      # Sanity-check step: verifies that critical app components (frontend, backend,
      # native modules) were actually packaged into the asar. Runs regardless of build
      # success/failure so partial builds are visible for debugging. This catches
      # regressions like missing frontend/dist builds, incomplete backend copies, or
      # failed native module rebuilds.
      - name: Verify asar contents
        if: always()
        shell: bash
        run: |
          set -x
          # Everything below is also tee'd into release-builds-summary.txt (small,
          # text-only) so it can be uploaded as its own lightweight artifact --
          # see "Upload build summary" below. Lets someone check whether packaging
          # and asar verification looked right without pulling the full ~600MB
          # electron-package-debug artifact just to read what's plain text.
          exec > >(tee release-builds-summary.txt) 2>&1

          find release-builds -maxdepth 2 -type d || echo "no release-builds dir"
          ASAR=$(find release-builds -name app.asar | head -n1 || true)
          if [ -z "$ASAR" ]; then
            echo "ERROR: NO app.asar FOUND -- build did not produce packaged output"
            exit 1
          fi

          echo ""
          echo "=== File sizes ==="
          find release-builds -maxdepth 2 -type f -exec ls -lh {} \; 2>/dev/null || true
          
          echo "Verifying required app components in asar..."
          MISSING=0
          
          # asar list prints backslash-separated paths on a Windows build
          # (\frontend\dist\index.html) but forward-slash paths on Linux/macOS --
          # normalize once so the grep patterns below match either way.
          #
          # Captured into a variable (once) rather than piped live into each grep/head
          # below: `ASAR_LIST | grep -q ...` closes its pipe the instant grep finds a
          # match, which sends SIGPIPE back to `npx asar list`/`tr`. Under
          # `set -e -o pipefail` that 141 exit status wins over grep's real (successful)
          # match, so every check below reported MISSING even when the file was present.
          # Using a captured variable + here-strings (<<<) avoids the live pipe entirely.
          LISTING=$(npx asar list "$ASAR" | tr '\\' '/')
          
          # Check frontend
          if grep -q "frontend/dist/index.html" <<< "$LISTING"; then
            echo "✓ frontend/dist/index.html found"
          else
            echo "✗ MISSING: frontend/dist/index.html"
            MISSING=1
          fi
          
          # Check backend
          if grep -q "backend/server.js" <<< "$LISTING"; then
            echo "✓ backend/server.js found"
          else
            echo "✗ MISSING: backend/server.js"
            MISSING=1
          fi
          
          # Check native module
          if grep -q -i "better-sqlite3" <<< "$LISTING"; then
            echo "✓ better-sqlite3 found in asar"
          else
            echo "✗ MISSING: better-sqlite3"
            MISSING=1
          fi
          
          # Verify better-sqlite3 native binary was unpacked correctly.
          # v13 (N-API) removed prebuild-install and ships its prebuilt .node
          # binary directly under prebuilds/<platform-arch>/ (see upstream
          # package.json: "files" includes "prebuilds/**", "gypfile": false) --
          # NOT the old v11-era build/Release/better_sqlite3.node path that
          # node-gyp/prebuild-install used to populate. Glob for any .node file
          # under prebuilds/ rather than assuming an exact filename, since the
          # per-platform folder/file naming isn't pinned down by our own code.
          UNPACKED_DIR=$(dirname "$ASAR")/app.asar.unpacked
          if find "$UNPACKED_DIR/node_modules/better-sqlite3/prebuilds" -name '*.node' 2>/dev/null | grep -q .; then
            echo "✓ better-sqlite3 native binary present under prebuilds/"
          else
            echo "✗ MISSING: better-sqlite3 native binary (checked prebuilds/**/*.node)"
            MISSING=1
          fi
          
          if [ "$MISSING" -eq 1 ]; then
            echo ""
            echo "ERROR: Critical app components missing from packaged asar"
            echo "Full asar contents:"
            head -50 <<< "$LISTING"
            exit 1
          fi
          
          echo ""
          echo "✓ All required app components verified in asar"

      # Issue #97 lead: "Worth checking whether better-sqlite3's native binary is
      # actually loadable at runtime on a clean machine (not just present in the asar
      # per the CI verification step, which only checks file presence, not that it
      # loads/executes correctly)." The step above only confirms the .node file exists
      # post-unpack; a bad @electron/rebuild run (wrong ABI, missing runtime dep, etc.)
      # can still leave a file there that's present but throws on require(). This step
      # actually loads it -- via the packaged app's own exe running in
      # ELECTRON_RUN_AS_NODE mode, the same execution path backendExecutable() uses for
      # the real spawned backend in production, not a plain system `node` (which would
      # be a different ABI and prove nothing about whether the packaged app itself can
      # load it) -- and runs a real query against an in-memory DB, not just an import.
      - name: Verify better-sqlite3 loads under Electron's Node ABI
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          UNPACKED_APP_DIR=$(find release-builds -maxdepth 1 -type d -name 'win-unpacked' | head -n1 || true)
          if [ -z "$UNPACKED_APP_DIR" ]; then
            echo "SKIP: no win-unpacked directory found (packaging step above already failed/produced nothing to test)"
            exit 0
          fi

          EXE=$(find "$UNPACKED_APP_DIR" -maxdepth 1 -name '*.exe' | head -n1 || true)
          MODULE_DIR="$UNPACKED_APP_DIR/resources/app.asar.unpacked/node_modules/better-sqlite3"

          if [ -z "$EXE" ]; then
            echo "SKIP: no packaged .exe found under $UNPACKED_APP_DIR"
            exit 0
          fi
          if [ ! -d "$MODULE_DIR" ]; then
            echo "SKIP: $MODULE_DIR not found -- unpacked-binary check above should already have failed this build"
            exit 0
          fi

          cat > verify-better-sqlite3.cjs <<'EOF'
          'use strict';
          const modulePath = process.argv[1];
          const Database = require(modulePath);
          const db = new Database(':memory:');
          db.exec('CREATE TABLE t (id INTEGER)');
          db.prepare('INSERT INTO t (id) VALUES (?)').run(1);
          const row = db.prepare('SELECT id FROM t').get();
          if (!row || row.id !== 1) {
            throw new Error('better-sqlite3 loaded but query returned an unexpected result: ' + JSON.stringify(row));
          }
          db.close();
          console.log('OK: better-sqlite3 loaded and executed a real query under Electron\'s Node ABI (ELECTRON_RUN_AS_NODE)');
          EOF

          echo "Requiring $MODULE_DIR via $EXE (ELECTRON_RUN_AS_NODE=1)..."
          if ELECTRON_RUN_AS_NODE=1 "$EXE" verify-better-sqlite3.cjs "$MODULE_DIR"; then
            echo "✓ better-sqlite3 loads and runs correctly under the packaged app's Electron ABI"
          else
            echo "✗ better-sqlite3 failed to load/execute under the packaged app's Electron ABI"
            echo "This is consistent with issue #97: a binary that's present but unloadable would"
            echo "crash the spawned backend at require-time with no window ever appearing."
            exit 1
          fi

      # Issue #97's literal reported symptom: processes running (visible in Task
      # Manager), no window ever appears, no error dialog. The two steps above verify
      # the native module in isolation but never actually run the app the way a user
      # does. This step does: launches the real win-unpacked exe as a normal packaged
      # Electron app (no ELECTRON_RUN_AS_NODE), polls the same /api/health endpoint
      # waitForBackend() polls from inside the app -- but from outside, exercising the
      # real spawnBackend() -> Express-binds-the-port sequence rather than a mocked or
      # isolated check -- then confirms a real window (non-zero MainWindowHandle)
      # actually appears afterward. `--disable-gpu` works around windows-latest runners
      # being GPU-less VMs (Chromium's GPU process can otherwise fail to init and hang
      # window creation for CI-environment reasons unrelated to #97's actual bug); a
      # real user's machine doesn't need it.
      - name: Launch packaged app and verify health check + window
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $unpackedDir = Get-ChildItem -Path release-builds -Directory -Filter 'win-unpacked' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $unpackedDir) {
            Write-Host "SKIP: no win-unpacked directory found (packaging step above already failed/produced nothing to test)"
            exit 0
          }
          $exe = Get-ChildItem -Path $unpackedDir.FullName -Filter '*.exe' -File | Select-Object -First 1
          if (-not $exe) {
            Write-Host "SKIP: no packaged .exe found under $($unpackedDir.FullName)"
            exit 0
          }

          Write-Host "Launching $($exe.FullName) (real packaged app, not ELECTRON_RUN_AS_NODE) ..."
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList '--disable-gpu' -PassThru

          try {
            $healthy = $false
            $deadline = (Get-Date).AddSeconds(45)
            while ((Get-Date) -lt $deadline) {
              if ($proc.HasExited) {
                Write-Host "::error::App process exited early (code $($proc.ExitCode)) before becoming healthy -- consistent with issue #97 (silent startup failure)."
                exit 1
              }
              try {
                $resp = Invoke-WebRequest -Uri 'http://localhost:4000/api/health' -UseBasicParsing -TimeoutSec 2
                if ($resp.StatusCode -eq 200) { $healthy = $true; break }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }

            if (-not $healthy) {
              Write-Host "::error::Backend never became healthy within 45s -- either it crashed silently or waitForBackend()'s health check never passed."
              exit 1
            }
            Write-Host "OK: backend responded on /api/health"

            # createWindow()/loadFile() run only after waitForBackend() resolves, so a
            # window-side bug (the actual #97 symptom) would show up here even with a
            # confirmed-healthy backend -- give it a grace period rather than checking
            # immediately.
            $windowFound = $false
            $windowDeadline = (Get-Date).AddSeconds(15)
            while ((Get-Date) -lt $windowDeadline) {
              $running = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
              if (-not $running) {
                Write-Host "::error::App process exited after passing the health check, before a window appeared."
                exit 1
              }
              if ($running.MainWindowHandle -ne 0) {
                $windowFound = $true
                Write-Host "OK: window detected (title: '$($running.MainWindowTitle)')"
                break
              }
              Start-Sleep -Milliseconds 500
            }

            if (-not $windowFound) {
              Write-Host "::error::No window appeared within 15s of the backend becoming healthy -- this is exactly issue #97's symptom (processes running, no window)."
              exit 1
            }

            Write-Host "PASS: packaged app launched, backend became healthy, and a window appeared."
          }
          finally {
            # Kill the whole process tree (Electron main + GPU/utility helper + spawned
            # backend node process) -- #97 itself is about these surviving with no
            # window, so leaving any running here would be the same leak, times three
            # orphaned processes on the runner.
            if ($proc -and -not $proc.HasExited) {
              taskkill /PID $proc.Id /T /F | Out-Null
            }

            # Best-effort: surface the packaged app's own backend.log (spawnBackend()'s
            # #97 logging) if it exists -- confirms that diagnostic actually gets
            # written, and useful in the workflow log regardless of pass/fail.
            $logCandidate = Get-ChildItem -Path "$env:APPDATA" -Recurse -Filter 'backend.log' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($logCandidate) {
              Write-Host "--- backend.log ($($logCandidate.FullName)) ---"
              Get-Content $logCandidate.FullName -ErrorAction SilentlyContinue
            } else {
              Write-Host "(no backend.log found under `$env:APPDATA -- expected if packaged startup never got far enough to spawn the backend, or logging itself is broken)"
            }
          }

      - name: Upload build summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-build-summary
          path: release-builds-summary.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload packaged app for inspection
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: electron-package-debug
          path: release-builds/
          if-no-files-found: warn
          retention-days: 7

      # electron-builder's own directories.output setting (root package.json's `build`
      # config: "release-builds") controls where this lands; the NSIS installer's exact
      # filename includes the version from package.json, so a glob picks it up without
      # hardcoding a version string here.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          # latest.yml is the update-feed manifest electron-updater's GitHub provider
          # polls to detect new versions -- it must be attached alongside the
          # installer or auto-update silently never finds anything newer. *.blockmap is
          # what lets it attempt a differential (delta) download instead of re-fetching
          # the full ~250MB installer on every update -- electron-builder generates one
          # automatically per NSIS build, it just needs to be published alongside the
          # other two files for electron-updater to find and use it.
          files: |
            release-builds/*.exe
            release-builds/latest.yml
            release-builds/*.blockmap
          generate_release_notes: true
          body: |
            Windows installer for ${{ github.ref_name }}. Run the installer, then launch
            ProEtsy from the Start menu -- no separate Node.js install or manual
            `npm start` needed (unlike the local-bundle tarball release also attached
            here). First run still needs a Gemini API key entered into the app's setup
            screen (ARCHITECTURE.md -> First-Run Setup).

            The installer is unsigned, so Windows SmartScreen will show a "Windows
            protected your PC" warning on first run -- click "More info" -> "Run anyway".
            See ARCHITECTURE.md -> Open Discussions -> "Unsigned Windows exe /
            SmartScreen."
