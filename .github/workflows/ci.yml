name: CI

# See ARCHITECTURE.md -> Testing & CI/CD:
# "On every push/PR: install, lint, run unit + integration tests."
# E2E (Playwright) is intentionally NOT run here — the same doc says those run on a
# schedule or on demand, not on every commit, since they're slower. No Playwright suite
# exists in the repo yet anyway (ARCHITECTURE.md -> Testing & CI/CD lists it as planned
# coverage, not built).
#
# Structured as one `install` job feeding three independent, parallel jobs (lint,
# backend-test, frontend-build) rather than one long sequential job. Two caching layers,
# each solving a different cost:
#   - `actions/setup-node`'s built-in `cache: npm` (install job only) caches npm's
#     download cache (~/.npm) keyed on package-lock.json, so `npm ci` doesn't re-fetch
#     tarballs from the registry on every run.
#   - An explicit `actions/cache` for `node_modules` itself, keyed the same way, shared
#     across all four jobs in a run: `install` populates it once (skipping `npm ci`
#     entirely on a cache hit), and lint/backend-test/frontend-build each restore that
#     same key instead of running their own `npm ci` — so dependency installation only
#     ever happens once per unique package-lock.json, not once per job, and the three
#     downstream jobs run concurrently instead of stacked behind each other.

on:
  push:
    branches: ['**']
    # Any markdown file, anywhere in the repo (not just the two root docs) -- a
    # docs-only change (e.g. docs/fixes/*.md) shouldn't burn a full install+lint+test+
    # build run. Only skips the workflow when EVERY changed file matches; a push that
    # touches both a .md file and real code still runs normally.
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

# Cancel superseded runs on the same branch/PR so pushing a fixup doesn't leave stale
# runs queued behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to a specific patch (not floating '24') -- 24.19.0 has a native-addon
  # cleanup-hook regression that intermittently crashes processes using native
  # modules (e.g. better-sqlite3) during worker/environment teardown. See
  # https://github.com/nexu-io/open-design/issues/6462. Bump deliberately once
  # upstream ships a fix, the same way package-lock.json pins other deps.
  NODE_VERSION: '24.18.0'

jobs:
  install:
    runs-on: ubuntu-latest
    outputs:
      node-modules-key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - id: key
        run: echo "key=node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"

      # Root package.json declares the backend/frontend workspaces, so npm hoists most
      # deps into the root node_modules — backend/node_modules and frontend/node_modules
      # are included too in case anything needed a nested install (a version conflict
      # between the two workspaces, etc.); `actions/cache` skips any path that doesn't
      # exist without failing the step.
      - name: Restore node_modules cache
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
          key: ${{ steps.key.outputs.key }}

      # `.npmrc` already sets legacy-peer-deps=true, which npm ci respects automatically.
      # Only runs on a cache miss (new/changed package-lock.json) — on a hit, node_modules
      # is already exactly what `npm ci` would have produced, so re-running it would just
      # burn time reproducing the same result.
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore node_modules cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
          key: ${{ needs.install.outputs.node-modules-key }}
      - run: npm run lint

  backend-test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore node_modules cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
          key: ${{ needs.install.outputs.node-modules-key }}
      # Vitest — unit + Supertest integration tests, per ARCHITECTURE.md's Module 1/2/3
      # status notes. better-sqlite3 (backend/db) needs no external service or Gemini
      # key: every test touching the LLM provider layer mocks lib/llm/index.js, and DB
      # tests point DB_PATH at a throwaway temp-file SQLite DB instead of the real local
      # one.
      - run: npm run test -w backend

  electron-test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore node_modules cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
          key: ${{ needs.install.outputs.node-modules-key }}
      # electron/main.test.js — root-scoped Vitest (vitest.config.js), 'electron' /
      # node:child_process / node:http mocked throughout, so this needs no real Electron
      # runtime, display, or backend process.
      - run: npm run test:electron

  frontend-test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore node_modules cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
          key: ${{ needs.install.outputs.node-modules-key }}
      # Vitest + Testing Library component suite (App.test.jsx, JobArtworkAnalysisReview/
      # JobListingReview/JobMockupReview/PromptHelper/TasteFilter .test.jsx), backed by
      # frontend/vitest.config.js (jsdom environment, src/test/setup.js). Previously only
      # `vite build` ran here, which never executes a single test file — this job closes
      # that gap so these suites actually gate pushes/PRs.
      - run: npm run test -w frontend

  frontend-build:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore node_modules cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
          key: ${{ needs.install.outputs.node-modules-key }}
      # Vite's own transform/dependency-optimization cache — separate from node_modules
      # since it's keyed on source content, not just installed deps, and falls back to a
      # prefix match (restore-keys) rather than requiring an exact hit, since any
      # same-branch cache is still useful even if the newest source files changed it.
      - name: Restore Vite cache
        uses: actions/cache@v5
        with:
          path: frontend/node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            vite-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      # `vite build` on top of frontend-test above — still worth keeping as its own job
      # since a production build catches syntax errors, broken imports, and bundler-level
      # issues that a jsdom test run alone wouldn't (e.g. import paths that only resolve
      # under Vitest's module resolution, or build-only config problems).
      - run: npm run build -w frontend
