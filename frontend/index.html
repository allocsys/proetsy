<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ProEtsy</title>
    <script>
      // plan.md Step 6: light theme -- set data-theme before first paint so
      // switching themes doesn't flash the wrong one on load. App.jsx reads
      // and writes the same 'proetsy_theme' key once React mounts.
      (function () {
        try {
          var stored = localStorage.getItem('proetsy_theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
